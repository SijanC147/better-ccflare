name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# One group per pull request, so a new commit cancels the runs still going for
# that PR's earlier commits. Pushes to main get a group per commit SHA, so they
# are never cancelled by each other and every commit on main keeps a full run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Bun and release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The trigger is deliberately NOT path-filtered: both job names are
      # required checks on the protected main ruleset, and a workflow skipped
      # by paths-ignore never reports them, which would block such a PR
      # forever. The jobs always run and always report; only the expensive
      # steps below are skipped, so a docs-only PR still goes green, fast.
      # `bun test` here includes scripts/hextap-contract.test.ts, which asserts
      # the exact file list of .github/workflows, so every change in there is
      # relevant to this job even though most of .github/** is not.
      - name: Detect result-affecting changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci-changed-paths quality

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install frozen dependencies
        if: steps.changes.outputs.relevant != 'false'
        run: bun install --frozen-lockfile

      - name: Typecheck
        if: steps.changes.outputs.relevant != 'false'
        run: bun run typecheck

      # SB23-1918. `bun run lint` cannot be this gate: it is
      # `biome check --write --unsafe`, which mutates the tree and can exit 0
      # having rewritten files, so it reports nothing. This is the read-only
      # form. It fails on errors only — the 30 warnings and 4 infos in the tree
      # are deliberate and nothing is suppressed, so gating them would force a
      # cleanup pass on code that is as intended.
      #
      # A step inside this job rather than a job of its own, because both job
      # names are required checks in ruleset `hextap/main` and a new one would
      # need a ruleset change. A step needs none.
      - name: Check formatting and lint
        if: steps.changes.outputs.relevant != 'false'
        run: bunx biome check .

      - name: Test
        if: steps.changes.outputs.relevant != 'false'
        run: bun test

      - name: Compile dashboard
        if: steps.changes.outputs.relevant != 'false'
        run: bun run build:dashboard

      - name: Test deterministic Hextap adapter
        if: steps.changes.outputs.relevant != 'false'
        run: bun run scripts/test-hextap-build.ts

      - name: Check adapter shell compatibility
        run: |
          /bin/bash -n scripts/hextap-build
          /bin/bash -n scripts/ci-changed-paths

      - name: Verify checks created no tracked changes
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

  hextap-contract:
    name: Hextap release contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      # Same reasoning as the other job: never path-filter the trigger, only
      # the steps. This job treats every .github/** change as relevant, which
      # is conservatism on the release boundary, not a measured dependency.
      - name: Detect result-affecting changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci-changed-paths contract
        working-directory: source

      - name: Check out Hextap v0.4.2 contract
        if: steps.changes.outputs.relevant != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SijanC147/hextap-toolkit
          ref: 613f0d37a0c84cff20a8e277fc5e9c374f9cbc26
          path: toolkit
          persist-credentials: false

      - name: Set up Go
        if: steps.changes.outputs.relevant != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false
          go-version-file: toolkit/go.mod

      - name: Set up pinned Bun
        if: steps.changes.outputs.relevant != 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Build trusted toolkit
        if: steps.changes.outputs.relevant != 'false'
        run: go build -trimpath -o "$RUNNER_TEMP/hextapctl" ./cmd/hextapctl
        working-directory: toolkit

      - name: Validate manifest and build all declared assets
        if: steps.changes.outputs.relevant != 'false'
        env:
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: |
          BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-runtime-cache"
          mkdir "$BUN_INSTALL_CACHE_DIR"
          chmod 700 "$BUN_INSTALL_CACHE_DIR"
          export BUN_INSTALL_CACHE_DIR
          "$RUNNER_TEMP/hextapctl" manifest validate \
            --file "$SOURCE_ROOT/.hextap.json"
          "$RUNNER_TEMP/hextapctl" release profile \
            --manifest "$SOURCE_ROOT/.hextap.json" \
            --source "$SOURCE_ROOT" \
            --phase build
          mkdir "$RUNNER_TEMP/release-assets"
          source_commit="$(git -C "$SOURCE_ROOT" rev-parse HEAD)"
          build_command=(
            "$RUNNER_TEMP/hextapctl" release build
            --manifest "$SOURCE_ROOT/.hextap.json"
            --version 3.8.2-rc.1
            --commit "$source_commit"
            --source "$SOURCE_ROOT"
            --output "$RUNNER_TEMP/release-assets"
          )
          sudo -n unshare --net -- \
            sudo -n -u "$USER" env \
              HOME="$HOME" \
              PATH="$PATH" \
              BUN_INSTALL_CACHE_DIR="$BUN_INSTALL_CACHE_DIR" \
              LANG="${LANG:-C}" \
              LC_ALL="${LC_ALL:-C}" \
              TMPDIR="${TMPDIR:-/tmp}" \
              TZ="${TZ:-UTC}" \
              USER="$USER" \
              LOGNAME="${LOGNAME:-$USER}" \
              "${build_command[@]}"
          "$RUNNER_TEMP/hextapctl" release verify \
            --manifest "$SOURCE_ROOT/.hextap.json" \
            --version 3.8.2-rc.1 \
            --commit "$source_commit" \
            --dir "$RUNNER_TEMP/release-assets" \
            --execute-target linux-amd64
          git -C "$SOURCE_ROOT" diff --exit-code
          git -C "$SOURCE_ROOT" diff --cached --exit-code
          test -z "$(git -C "$SOURCE_ROOT" status --porcelain --untracked-files=no)"
        working-directory: toolkit
