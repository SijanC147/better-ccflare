name: SignPath Test Signing

on:
  workflow_dispatch:

jobs:
  sign:
    name: Test-sign Windows binary
    runs-on: ubuntu-latest
    # read, not write. Nothing in this job writes to the repository: it builds,
    # uploads two artifacts and submits a signing request. `contents: write`
    # granted a token that can push to the repo to a job that also holds
    # SIGNPATH_API_TOKEN, so a compromised step in any of the six third-party
    # actions below could have committed. `actions: read` stays — the SignPath
    # action reads the uploaded artifact through the Actions API.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          # Explicit rather than implied. On workflow_dispatch this is the ref
          # the dispatcher selected, so whoever can run this workflow chooses
          # what gets test-signed. That is the intended capability — the point
          # is to test-sign a branch before release — but it should be visible
          # in the file rather than left to the default. The signing policy is
          # `test-signing`, not release signing, which bounds what a signature
          # from this workflow asserts.
          ref: ${{ github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build dashboard
        run: bun run build:dashboard

      - name: Build all architectures
        run: |
          cd apps/cli
          bun run build:multi
          ls -lh dist/better-ccflare-windows-x64.exe

      - name: Upload unsigned binary
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-unsigned
          path: apps/cli/dist/better-ccflare-windows-x64.exe
          retention-days: 1

      - name: Submit test-signing request
        uses: signpath/github-action-submit-signing-request@ced31329c0317e779dad2eec2a7c3bb46ea1343e # v1
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'better-ccflare'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'release'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'signed'

      - name: Upload signed binary as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-signed-test
          path: signed/better-ccflare-windows-x64.exe
          retention-days: 7
