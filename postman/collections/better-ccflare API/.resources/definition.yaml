$kind: collection
name: 'better-ccflare API'
description: |-
  Generated by `scripts/postman-generate-collection.ts` from `packages/types/src/api-catalog.ts`. Edit the script, not these files.
  
  `baseUrl` defaults to the production server on 8080. For automated runs point it at an isolated server on 8081 (`--env-var baseUrl=http://127.0.0.1:8081`).
  
  Only `Smoke` is safe to run as a batch against 8080. `OpenAI gateway` spends real account quota, and the catalog folders include mutating and dangerous routes.
variables:
  - key: baseUrl
    value: 'http://localhost:8080'
  - key: model
    value: 'claude-opus-5-5'
  - key: gateway
    value: 'no-oauth'
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{ApiKey}}'
