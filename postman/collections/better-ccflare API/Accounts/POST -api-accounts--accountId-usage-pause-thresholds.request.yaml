$kind: http-request
name: 'POST /api/accounts/:accountId/usage-pause-thresholds'
description: |-
  Set when the account pauses itself on each of its 5-hour and weekly usage windows: at a usage percentage, while the window's reset is still at least some time away, or both, each window switchable on its own.
  
  Body: { "fiveHour": { "enabled": true, "percent": 80, "minResetRemainingMs": 7200000 }, "weekly": { "enabled": false, "percent": null, "minResetRemainingMs": null } }
method: POST
url: '{{baseUrl}}/api/accounts/:accountId/usage-pause-thresholds'
order: 34000
headers:
  - key: 'Content-Type'
    value: 'application/json'
pathVariables:
  - key: 'accountId'
    value: ''
body:
  type: json
  content: |-
    {}
