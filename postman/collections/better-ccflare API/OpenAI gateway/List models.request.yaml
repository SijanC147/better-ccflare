$kind: http-request
method: GET
url: '{{baseUrl}}/v1/models'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 200", () => pm.response.to.have.status(200));
      pm.test("list of models", () => pm.expect(pm.response.json().data).to.be.an("array"));
