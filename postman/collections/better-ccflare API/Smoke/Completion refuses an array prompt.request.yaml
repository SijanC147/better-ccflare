$kind: http-request
description: |-
  Refused by the legacy Completions translator before routing, so it reaches no account (SB23-1970). Every array `prompt` is refused, one element included. On a release without that translator the request falls through to `handleProxy`, which is why `max_tokens` is 1.
method: POST
url: '{{baseUrl}}/v1/completions'
order: 5000
headers:
  - key: 'Content-Type'
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "model": "{{model}}",
      "prompt": [
        "pong"
      ],
      "max_tokens": 1
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("status is 400", () => pm.response.to.have.status(400));
      pm.test("OpenAI-shaped error with code unsupported_value", () => {
        const body = pm.response.json();
        pm.expect(body).to.have.property("error");
        pm.expect(body.error.code).to.eql("unsupported_value");
        pm.expect(body.error.param).to.eql("prompt");
      });
